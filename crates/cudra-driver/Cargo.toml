[package]
name = "cudra-driver"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "cudra_driver"
path = "src/lib.rs"

[[bin]]
name = "cudrac"
path = "src/main.rs"

[dependencies]
cudra-span = { path = "../cudra-span" }
cudra-diagnostics = { path = "../cudra-diagnostics" }
cudra-lexer = { path = "../cudra-lexer" }
cudra-ast = { path = "../cudra-ast" }
cudra-parser = { path = "../cudra-parser" }
cudra-tir = { path = "../cudra-tir" }
cudra-sema = { path = "../cudra-sema" }
cudra-codegen-llvm = { path = "../cudra-codegen-llvm" }
clap = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
